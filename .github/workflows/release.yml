name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bun run build
      - run: bun test src apps/playground apps/website resources
      - run: bun run typecheck
      - run: bun run playground:build
      - run: bun run website:build
      # ESM only, on purpose: the profile leaves out CommonJS `require` and node10 resolution, and
      # fails on any other problem with the types or the entry points of the pack.
      - run: bunx @arethetypeswrong/cli --pack . --profile esm-only

  # The package as npm installs it (scripts/smoke.ts), under every Node version `engines` allows.
  smoke:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun scripts/smoke.ts "$(command -v node)"

  tag:
    needs: [check, smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # The build (`prepack`, run by `bun pm pack` and `npm publish`) needs the dev dependencies.
      - run: bun install --frozen-lockfile
      # The tag points at a commit on the `release` branch that holds only the packed package
      # (scripts/release-commit.ts): Bun installs a git dependency as the whole tagged tree and
      # ignores the `files` list, so tagging a commit of main would ship the whole repository.
      - name: Tag the version in package.json
        id: tag
        run: |
          version="v$(jq -r .version package.json)"
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
            echo "$version already tagged"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          parent=""
          if git fetch --quiet origin release; then parent="$(git rev-parse FETCH_HEAD)"; fi
          commit="$(bun scripts/release-commit.ts $parent)"
          # plain tag, not annotated: Bun 1.3 cannot resolve an annotated tag by name
          git tag "$version" "$commit"
          # atomic: a rejected branch update (the tip moved since the fetch) must not leave a tag on an orphan commit
          git push --atomic origin "$commit:refs/heads/release" "refs/tags/$version"
          echo "created=true" >> "$GITHUB_OUTPUT"
      # Only when the tag was just created, so a version reaches npm once. Trusted publishing: npm
      # takes the workflow's OIDC token (id-token: write), no secret; it needs npm 11.5.1 or later,
      # which Node 24 ships. `prepack` builds dist/ first. If this step fails after the tag was
      # pushed, a re-run sees `created=false` and skips it: publish by hand with `npm publish` from
      # a checkout of the tag (the release commit already holds the built package).
      - name: Publish to npm
        if: steps.tag.outputs.created == 'true'
        run: npm publish --provenance --access public
