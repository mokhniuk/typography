# How the built site is served (see the Dockerfile at the repository root). The site is static files
# with a page per directory (`/docs/api/index.html`), so nginx needs no rewriting beyond finding the
# index of a directory and serving the 404 page for an address that is not there.

# The cache lifetime of a file by its address. An empty value adds no header (nginx skips it).
# It is a map, not an `add_header` per location, because a location that sets any header drops every
# header the server block sets: all headers stay in one place, the server block.
map $uri $cache_control {
  default "";
  # Every asset name holds the hash of its contents, so it can be cached for good.
  ~^/assets/ "public, max-age=31536000, immutable";
  # A page is rewritten in place by a deployment, so it must be revalidated every time.
  ~*\.html$ "no-cache";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # A redirect keeps the host it was asked for: behind a proxy the container's own name is not it.
  absolute_redirect off;

  # `/docs/api` is redirected to `/docs/api/`, so the page's relative links resolve from there.
  location / {
    try_files $uri $uri/ =404;
  }

  location /assets/ {
    try_files $uri =404;
  }

  # The 404 page's links start at the site root, so it works at any depth (see build/plugin.ts).
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  add_header Cache-Control $cache_control always;

  # Defence in depth: the pages hold no user input a script could run from, and these headers keep it so.
  # The two hashes allow the only inline scripts, the theme script in the head and the hang script the
  # build appends (`bun test apps/website` fails when either changes, then the hash is replaced here).
  # Inline styles stay allowed because the hanging punctuation is placed with `style` attributes, and
  # `data:` images because the select arrow in style.css is one. The visitor statistics (Umami, on
  # umami.mokhni.uk) are the one other origin: the script is loaded from it and each visit is sent back
  # to it, so it is named in `script-src` and `connect-src`. The playground's preview frame
  # inherits this policy, so pasted HTML cannot load a remote image or script. There is no HSTS: the
  # container speaks plain HTTP and the proxy in front of it owns TLS.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://umami.mokhni.uk 'sha256-f5d8zgsSoLAcmnIowIGDh7dC/uAYvsg2edaFuBEotys=' 'sha256-DymghPMDF9kSyuSpUCBe1yYa/5XiOIZGhKKjOgEpIA4='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://umami.mokhni.uk; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/xml application/atom+xml image/svg+xml;
}
