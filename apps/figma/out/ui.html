<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Typography settings</title>
<style>:root {
  --color-bg: #ffffff;
  --color-text: #1e1e1e;
  --color-muted: #5f6368;
  --color-line: #e2e2e6;
  --color-accent: #0b6bcb;
  --color-accent-text: #ffffff;
  --color-field: #ffffff;
  --color-field-line: #c9c9d0;
  --radius-md: 6px;
  --space-3: 8px;
  --space-5: 16px;
  --space-6: 24px;
  --size-sm: 12px;
  --size-md: 14px;
  --font-ui: system-ui, -apple-system, "Segoe UI", sans-serif;
  --control-height: 32px;
  color-scheme: light;
}
:root.figma-dark {
  --color-bg: #2c2c2c;
  --color-text: #f2f2f2;
  --color-muted: #b8b8b8;
  --color-line: #444444;
  --color-accent: #4da3ff;
  --color-accent-text: #0a0a0a;
  --color-field: #383838;
  --color-field-line: #5a5a5a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font: var(--size-md) / 24px var(--font-ui);
}
main { display: flex; flex-direction: column; gap: var(--space-5); padding: var(--space-5); min-height: 100vh; }
h1 { margin: 0; font-size: 16px; line-height: 24px; }
form { display: flex; flex-direction: column; gap: var(--space-5); }
label { display: flex; flex-direction: column; gap: var(--space-3); font-size: var(--size-sm); line-height: 16px; color: var(--color-muted); }
select {
  height: var(--control-height);
  padding: 0 var(--space-3);
  border: 1px solid var(--color-field-line);
  border-radius: var(--radius-md);
  background: var(--color-field);
  color: var(--color-text);
  font: inherit;
}
details { font-size: var(--size-md); }
summary { cursor: pointer; }
output { color: var(--color-muted); font-size: var(--size-sm); }
#rules { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-3) 0; }
fieldset { margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 0; min-width: 0; }
legend { padding: 0; font-size: var(--size-sm); color: var(--color-muted); text-transform: capitalize; }
fieldset label { flex-direction: row; align-items: center; gap: var(--space-3); font-size: var(--size-md); line-height: 24px; color: var(--color-text); }
button {
  height: var(--control-height);
  padding: 0 var(--space-5);
  border: 1px solid var(--color-field-line);
  border-radius: var(--radius-md);
  background: var(--color-field);
  color: var(--color-text);
  font: inherit;
  cursor: pointer;
}
button.primary { border-color: var(--color-accent); background: var(--color-accent); color: var(--color-accent-text); font-weight: 600; }
[data-hint] { margin: 0; font-size: var(--size-sm); line-height: 16px; color: var(--color-muted); }
footer { margin-top: auto; display: flex; justify-content: flex-end; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Typography settings</h1>
  <form aria-label="Settings">
    <label>Language
      <select id="lang"></select>
    </label>
    <label>Register
      <select id="register">
        <option value="display">Display (UI and marketing)</option>
        <option value="literary">Literary (books)</option>
      </select>
    </label>
    <label>Quotes
      <select id="quoteStyle">
        <option value="language">Of the language</option>
        <option value="us">US: “…” and ‘…’</option>
        <option value="guillemets">Guillemets: «…» and „…“</option>
      </select>
    </label>
    <details>
      <summary>Rules <output id="badge"></output></summary>
      <div id="rules"></div>
      <button type="button" id="reset">Reset rules</button>
    </details>
  </form>
  <p data-hint>Saved as you change it. It applies to Format selection and Format page.</p>
  <footer><button type="button" id="done" class="primary">Done</button></footer>
</main>

C" among fixed-space cases). Other abbreviations in 10.4.2 (вж., т.е., и т.н., г-н, д-р) are given without a no-break rule, so none is invented.',"Not implemented, not verified: one-letter prepositions (в, с, к, у, о) are not kept off the end of a line, because the ISG states no such rule and the Institute for Bulgarian Language rules were not read; the sentence dash is the engine's default em dash, which matches the spaced em dash of ISG 10.1.8; the dialogue dash is set from the Institute page above."].join(" ")};var kQ={code:"cs",name:"Czech (čeština)",sample:'Řekl "jdeme k lesu" - a odešel... Laboratoř běží 21-26 září, 10:00-12:00, 14% sleva. Více ->',quotes:[["„","“"],["‚","‘"]],orphans:/(?<![\p{L}\p{N}])([kKsSvVzZoOuUaAiI])[ ]+(?=\S)/gu,shortWords:["do","od","ve","na","se","za","po","pro","při","nad","pod","bez"],sentenceDash:"–",sentenceDashLiterary:"–",percentSpace:!0,currencySpace:!0,numbers:{group:X,decimal:","},dialogueDash:{mark:"–"},reviewed:!1,sources:["https://prirucka.ujc.cas.cz/?id=165","https://prirucka.ujc.cas.cz/?slovo=uvozovky","https://prirucka.ujc.cas.cz/?id=880","https://prirucka.ujc.cas.cz/?slovo=procento","https://prirucka.ujc.cas.cz/?slovo=poml%C4%8Dka","https://en.wikipedia.org/wiki/Quotation_mark"],notes:"Quotes: „…“ with ‚…‘ inside (Internetová jazyková příručka, ÚJČ AV ČR, the recommended basic form); "+"the guillemets »…« and ›…‹ are allowed by the same page and are not set. "+"One-letter words: the příručka bars a line break after k, s, v, z, o, u, a, i; it names the words, not their capital forms, so the capitals are bound by the same reasoning (not stated, not verified). "+"% and currency: the příručka writes a space between number and symbol (14 %) and bars a line break there; a currency sign other than € (Kč) is bound by the number-unit rule, not by this pack. "+"Sentence dash: the příručka sets a spaced pomlčka (–). "+"Number format: group by three with a space, decimal comma (příručka, ?slovo=procento); carried only, the engine does not read it yet. "+"Not implemented, not verified: the EU Interinstitutional Style Guide could not be read (its pages are scripted and gave no text), so none of its Czech rules were used; no abbreviation list (no list was read). "+'Dialogue: quotes are the main form, but a pomlčka at the start of a line may open direct speech (Internetová jazyková příručka, "Pomlčka" and "Uvozovky").'};var NQ={code:"da",name:"Danish (dansk)",sample:'Hun sagde "vi er her" - og gik... Kurset løber 21-26 september, fra kl. 10.00. Læs mere ->',quotes:[["»","«"]],turnedPairs:[["»","«"]],abbreviations:{bind:["nr","stk","kl","mio","mia"],page:["s"]},percentSpace:!0,currencySpace:!0,numbers:{group:X,decimal:","},dialogueDash:{mark:"—"},reviewed:!1,sources:["https://ro.dsn.dk/?paragraf=59&type=rulesearch","https://publications.europa.eu/resource/cellar/01ed788a-d266-11ec-a95f-01aa75ed71a1.0022.01/DOC_1 (Vejledning i Udformning af EU-Publikationer, PDF of 19 April 2022: 4.2.3 anførselstegn og tal, 6.4 mellemrum i forbindelse med tegnsætning, 6.5 tegnsætning i tal, 10.1 diverse regler, 10.2 tal og datoer, bilag A3 forkortelser)"],notes:["Dialogue: a replikstreg, the same form as the tankestreg (the long dash, see above), may open a line of dialogue (Retskrivningsordbogen 5.1, § 59); quotes or no marks are equally allowed, and the attribution follows a comma.","Quotes: ISG 4.2.3 says Danish uses the same marks at every level, »…«, and 10.1 gives the nested form »…»…«…«. The mark pairs are read by position (turnedPairs), as in German. The other Danish convention, „…“ (and ‚…‘ inside), which Dansk Sprognævn also accepts, is not implemented and was not read at its source.",'The sentence dash is the long dash with spaces (ISG 6.4 table and 10.1: "som tankestreg bruges den lange"), which is the engine default; the en dash is the minus and the range sign.',"Abbreviations: only those the ISG itself writes before a figure or an amount (10.2: s. 50, stk. 3, kl. 17.30; 4.2.3: nr., s.; 10.1: mio. EUR; annex A3: mio., mia.). Danish abbreviations such as f.eks., bl.a., dvs., osv. are written without inner spaces (10.3, A3), so there is nothing to keep together.","Not implemented, not verified: one-letter words (the ISG gives no list), the dash rules of Retskrivningsordbogen (Dansk Sprognævn was not read), % before a currency (the ISG writes EUR after a figure, 10.2, with an ordinary space)."].join(" ")};var G=["em","til","till","cause","bout","round","tis","twas","cos","n"];var w={code:"de",name:"German (Deutsch)",sample:'Er sagte "wir sind da" - und ging... Das Labor läuft 21-26 September, 10:00-12:00. Mehr lesen ->',quotes:[["»","«"],["›","‹"]],turnedPairs:[["»","«"],["›","‹"]],abbreviations:{together:["z. B.","d. h.","u. a.","u. U.","i. d. R.","v. a.","s. o.","s. u."],bind:["Nr","Abb","Tab","Tel","Bd","Hrsg","vgl","ca"],page:["S"]},sentenceDash:"–",sentenceDashLiterary:"–",percentSpace:!0,currencySpace:!0,elisions:G,numbers:{group:" ",decimal:","},reviewed:!1,sources:["https://style-guide.europa.eu/en/content/-/isg/topic?identifier=6.5-punctuation-in-figures"],notes:"The other German style, `„outer ‚inner‘ outer“`, is a literary profile that does not exist yet. Digits are grouped with a no-break space (number.group), as the Interinstitutional Style Guide sets for all languages; a point is not used for thousands. The decimal mark is a comma."};var wV="https://www.bk.admin.ch/dam/de/sd-web/YVHazXZRkqKn/schreibweisungen.pdf (Schweizerische Bundeskanzlei, Schreibweisungen, 2nd ed. 2013, corrected 2015, read in full as PDF text: Rz. 202-206 Anführungszeichen, 251 Festabstand, 512-514 Zahlen, 539-543 Geldbeträge, 554-555 Prozent)",BV='https://raw.githubusercontent.com/unicode-org/cldr-json/main/cldr-json/cldr-numbers-full/main/de-CH/numbers.json (CLDR 48, cldr-numbers-full 48.2.3: currency pattern "¤ #,##0.00" with U+00A0, the sign first; percent pattern "#,##0%", no space)',SQ={code:"de-CH",name:"German (Switzerland)",sample:'Er sagte "wir sind da" - und ging... Das Labor läuft 21-26 September, 10:00-12:00. Mehr lesen ->',quotes:[["«","»"],["‹","›"]],abbreviations:w.abbreviations,sentenceDash:w.sentenceDash,sentenceDashLiterary:w.sentenceDashLiterary,percentSpace:!0,currencySpace:!0,elisions:w.elisions,numbers:{group:X,decimal:",."},reviewed:!1,sources:[wV,BV,...w.sources],notes:["Read from the Swiss Federal Chancellery Schreibweisungen (2nd ed. 2013, corrected 2015), the official PDF read in full as text (Rz. 202-206, 251, 512-514, 539-555); the pack stays reviewed: false (no native reader).","Quotes: `«outer ‹inner› outer»`, without spaces inside (Rz. 202, 203; Rz. 202 rejects Germany’s turned `»…«` for official texts and Rz. 206 does not recommend `„…“`). CLDR gives `„…“` and `‚…‘` for de-CH, so the choice stays disputed (resources/sources.md); the Schreibweisungen bind official texts only.",'Numbers: digits are grouped in threes with a Festabstand (no-break space) from five digits up (number.group; Rz. 512; a four-digit number is not split, and Rz. 513’s grouping of four digits in a table of larger numbers is not seen by a text engine). The apostrophe (1’000’000) "sollte nicht mehr angewendet werden" (Rz. 512), so it is not used. The decimal mark is a comma (Rz. 514: 4,16 Millionen), and in a money amount the point separates francs and rappen (Rz. 514, 543: Fr. 327.65). A point or a comma never groups digits in Swiss federal texts ("Nicht korrekt ist die Gliederung mit Punkten oder Kommas", Rz. 512), so number.group reads both as decimal marks (numbers.decimal ",.") and groups the whole part: 1234567,50 and Fr. 1234567.50 become 1 234 567,50 and Fr. 1 234 567.50.','Percent and currency: a Festabstand between a figure and % or ‰ (Rz. 554) and between a figure and a currency unit or sign (Rz. 539, 540: 20 Franken, € 64.15), so percentSpace and currencySpace are set. CLDR 48 disagrees on %: its de-CH percent pattern is "#,##0%" without a space; the Chancellery is followed here. Not done: Rz. 555 writes a compound without the space (6%-Anteil), the engine sets one; Rz. 540 recommends a Festabstand after a prefixed Fr. or € (Fr. 327.65), the engine binds only a sign it knows (€, CHF), not Fr.',"The abbreviation lists and the spaced en dash are German’s (the de pack), not checked against the Schreibweisungen."].join(" ")};var EQ={code:"el",name:"Greek (Ελληνικά)",sample:'Είπε "είμαστε εδώ" - και έφυγε... Το μάθημα διαρκεί 21-26 Σεπτεμβρίου, 10:00-12:00. Διάβασε περισσότερα ->',quotes:[["«","»"],["“","”"],["‘","’"]],abbreviations:{bind:["αριθ","βλ","δισ","εκατ","κ"],page:["σ","σελ"]},percentSpace:!0,currencySpace:!0,numbers:{group:X,decimal:","},reviewed:!1,sources:["https://publications.europa.eu/resource/cellar/01ed788a-d266-11ec-a95f-01aa75ed71a1.0016.01/DOC_1 (Διοργανικό εγχειρίδιο σύνταξης κειμένων, PDF of 19 April 2022: 4.2.3 σύνταξη του κειμένου (εισαγωγικά, απόστροφοι), 6.4 διαστήματα και σημεία στίξης, 6.5 αριθμοί και σημεία στίξης, 10.1.3 άνω τελεία, 10.1.7 εισαγωγικά, 10.1.8 ενωτικό, παύλα, 10.6 συντομογραφίες, παράρτημα A3 συντομογραφίες)"],notes:[`Quotes: «…» first, then “…”, then ‘…’ (ISG 10.1.7, 4.2.3 "τρία επίπεδα"; the ISG prefers the double angular marks in Greek text). The option quoteStyle: 'us' gives “…” with ‘…’ inside.`,"The Greek question mark ; and the ano teleia · stand directly after their word (ISG 6.4 table); no rule here adds or removes a space before them, which a test pins.","Abbreviations: only those the ISG lists in annex A3 and uses before a number or a name (αριθ., βλ., δισ., εκατ., κ., σ.); σελ. is mentioned in the A3 comment on σ. as occurring in EU texts. Greek abbreviations such as π.χ. and κ.λπ. are written without inner spaces (10.6), so there is nothing to keep together. Greek letters are matched as Unicode letters.","Not implemented, not verified: the double long dash of 10.1.8 is written attached to the text it encloses (—inciso—) and spaced from the text outside, and a single long dash for an abrupt change takes no space after it, but the engine sets a spaced dash on both sides; one-letter words (the ISG gives no list); the final nu rule (10.4); dates and the ordinal rules of 10.8; the Institute of Modern Greek Studies (Triantafyllidis Foundation) was not read, so no rule rests on it."].join(" ")};var hQ={code:"en",name:"English",sample:`He said "we're here" - and left... The lab runs 21-26 September, 10:00-12:00. Read more ->`,quotes:[["“","”"],["‘","’"]],literary:[["‘","’"],["“","”"]],orphans:/(?<![\p{L}\p{N}])([aAI])[ ]+(?=\S)/gu,shortWords:["to","of","in","on","at","by","as","or","if","an","the","and","for"],abbreviations:{page:["No","Nos","Fig","Figs","Vol","Ch","Sec","Art","p","pp"]},sentenceDashLiterary:"–",elisions:G,numbers:{group:",",decimal:"."},bareTemperature:!0,reviewed:!1,sources:["https://commission.europa.eu/system/files/2023-11/styleguide_english_dgt_en.pdf","https://style-guide.europa.eu/en/content/-/isg/topic?identifier=6.5-punctuation-in-figures"],notes:"Display register uses “…” with ‘…’ inside, as CLDR gives English; British quotes (‘…’ with “…” inside) are the literary register; quoteStyle: 'guillemets' sets the former house style, «…» with „…“ inside. Digits of a number of five or more are grouped with a comma (opt-in rule number.group): the EU English Style Guide sets a hard space in running text and allows a comma for web writing, promotional material and press releases, which is what this engine is for. The separator is the pack field numbers.group (a no-break space is the EU form)."};var uQ={code:"es",name:"Spanish (español)",sample:'¿Dijo "ya estamos aquí" - y se fue...? El laboratorio dura 21-26 de septiembre, 10:00-12:00. Leer más ->',quotes:[["«","»"],["“","”"],["‘","’"]],openers:"¿¡",abbreviations:{together:["EE. UU.","JJ. OO.","a. m.","p. m.","N. B."],bind:["Sr"],page:["p","pp"]},percentSpace:!0,currencySpace:!0,numbers:{group:X,decimal:","},dialogueDash:{mark:"—",attached:!0},reviewed:!1,sources:["https://www.rae.es/ortograf%C3%ADa/otros-usos-de-la-raya","https://publications.europa.eu/resource/cellar/01ed788a-d266-11ec-a95f-01aa75ed71a1.0002.03/DOC_1 (Libro de estilo interinstitucional, PDF of 19 April 2022: 4.2.3 niveles de comillas, 6.4 espaciado de los signos de puntuación, 6.5 puntuación en las cifras, 7.3.3 referencias monetarias, 10.1.8 raya, 10.1.11 interrogación y exclamación, 10.1.12 comillas, 10.3.1.4 tantos por ciento, 10.4 abreviaturas)","https://op.europa.eu/en/web/eu-vocabularies/formex/physical-specifications/character-encoding/use-of-quotation-marks-in-the-different-languages (Publications Office, quotation marks per language: es «…» “…” ‘…’)","https://es.wikipedia.org/wiki/Comillas (cross-check only: it reports the RAE order «…“…‘…’…”…» and the Mexican Academy order “…‘…«…»…’…”; the RAE pages themselves, rae.es, answered 403 and were not read)"],notes:["Dialogue: the raya opens each turn and is written attached to it, with no space (RAE/ASALE, Ortografía 2010, § 3.4.7.2.1). Words of the narrator inside the turn take a raya on each side, attached inside; the engine spaces them (see the paired-dash gap).","Quotation: «…» then “…” then ‘…’ is the order of the Libro de estilo interinstitucional (10.1.12), which it takes from the RAE; the Mexican Academy recommends the reverse for the Americas (“…‘…«…»…’…”), and “…” first is common in Latin America. The option quoteStyle: 'us' gives “…” with ‘…’ inside.","Not implemented, not verified: the double raya of 10.1.8 is written attached to the text it encloses (—inciso—) and spaced from the text outside, but the engine sets a spaced dash on both sides (x — y), so a Spanish aside comes out spaced inside; a dialogue line opening with a spaced hyphen or dash becomes an attached raya (—Hola), set from the RAE above; the ISG gives no list of one-letter words to keep off the end of a line, so there are no orphans; the ISG shows the € symbol only in graphics and press releases (7.3.3) and puts a fixed space before the code EUR, so the space before € here follows the code.","Numbers: ISG 6.5 prescribes a comma and a fixed space; secondary articles report that the 2005 RAE dictionary of doubts and Latin American usage differ on the % space and on the decimal point; none of that was read at its source.","The abbreviation lists are only those the ISG itself gives as examples of a non-split abbreviation (10.4 and the fixed-space list in 4.2.3); the ordinals n.º and D.ª are not covered."].join(" ")};var pQ={code:"et",name:"Estonian (eesti)",sample:'Ta ütles "me oleme siin" - ja läks... Seminar kestab 21-26 septembrini, 10:00-12:00, 5% rohkem. Loe edasi ->',quotes:[["„","“"]],sentenceDash:"–",abbreviations:{bare:["nr","lk"]},percentSpace:!0,currencySpace:!1,numbers:{group:X,decimal:","},reviewed:!1,sources:["https://publications.europa.eu/resource/cellar/01ed788a-d266-11ec-a95f-01aa75ed71a1.0013.01/DOC_1 (Väljaannete stiilijuhend, Estonian PDF of 19 April 2022, read as text with pdfjs: 4.2.3 teksti ettevalmistamine (jutumärgid, liikumatud sõnavahed, numbrid), 5.10 tsitaadid, 6.4 kirjavahemärgid ja sõnavahe, 6.5 kirjavahemärgid arvudes, 10.1.6 jutumärgid, 10.1.7 mõtte- ja sidekriips, 10.7 mitmesugust, lisa A3 lühendid ja sümbolid)","https://op.europa.eu/en/web/eu-vocabularies/formex/physical-specifications/character-encoding/use-of-quotation-marks-in-the-different-languages (Publications Office, quotation marks per language: et „…“ at all three levels)"],notes:['Quotation: the ISG (4.2.3, 5.10, 10.1.6) and the Publications Office table write „…“ at every level, so a quotation inside a quotation is „…„…“…“ here (5.10: "Jutumärke võib panna topelt"). ‚…‘ for the inner level was suggested to this pack and was not found in the ISG, so it is not set. The Eesti Keele Instituut (Õigekeelsussõnaraamat, Eesti keele käsiraamat) was not opened, so nothing says whether the national norm differs.',"Dash: ISG 10.1.7 names the en dash (U+2013) as the dash of ELT texts and does not give the spacing; its examples in 10.7 (tähtaeg – ajavahemik) set it with a space on each side, as the engine does.","Numbers: ISG 6.5 gives a comma for decimals and a space between groups of three digits for numbers of five digits or more, counted from the right; 4.2.3 says the space is a no-break one and that codes, postal codes and years (1961. aastal, lk 2064) are not grouped; the engine groups from five digits, which is the same threshold.","Known engine gap, not a pack field: the omission mark [---] that the ISG writes in quotations (5.10, 10.1.6) is rewritten by the dash rules to [ – -] in every language; et.test.ts holds a test marked failing for it.",'Abbreviations: the ISG sets a fixed space after nr and lk (4.2.3: "nr• ELT L•", "lk• ELT C•"), written without a full stop; the pack binds them to a number after them (the bare list: nr 5, lk 12; matched in lower case only). The ISG examples bind them to a publication name too (nr ELT L); that is not done, a bare abbreviation stays with a number only. The other abbreviations of annex A3 (s.o, k.a, v.a, n-ö, et al.) are written without a space inside. Not implemented, not verified: no orphans: the ISG gives no list of one-letter words to keep off the end of a line. No elisions read. The ISG shows € only as the code EUR, so the pack sets percentSpace and not currencySpace (49€ stays 49€).'].join(" ")};var mQ={code:"fi",name:"Finnish (suomi)",sample:'Hän sanoi "olemme täällä" - ja lähti... Kurssi kestää 21-26 syyskuuta, 10:00-12:00. Lue lisää ->',quotes:[["”","”"],["’","’"]],sameMarkQuotes:!0,abbreviations:{bind:["p","v","mrd"],page:["s"],bare:["klo","nro"]},sentenceDash:"–",percentSpace:!0,currencySpace:!0,numbers:{group:X,decimal:","},dialogueDash:{mark:"–"},reviewed:!1,sources:["https://kielitoimistonohjepankki.fi/ohje/lainausmerkit-ja-vuorosanaviiva/","https://publications.europa.eu/resource/cellar/01ed788a-d266-11ec-a95f-01aa75ed71a1.0017.01/DOC_1 (Toimielinten yhteiset tekstinlaadinnan ohjeet, PDF of 19 April 2022: 4.2.3 tekstin valmistelu, 6.4 välilyönnit välimerkkien yhteydessä, 6.5 välit ja välimerkit numeroissa, 10.2.1 numerot, 10.4.5 lainausmerkit, 10.4.8 ajatusviiva, 10.7.1 lyhenteet)","https://kotus.fi/joudutko-lainaamaan-kieli-keskella-suuta/ (Kotus: an inner quotation takes puolilainausmerkit ’…’, the same character as the apostrophe)","https://kielitoimistonohjepankki.fi/ohje/lainausmerkit-ja-suora-lainaus/ (Kielitoimiston ohjepankki: ”…” at both ends, examples)"],notes:['Dialogue: the ajatusviiva is used as a dialogue dash instead of quotes, especially in interviews and fiction (Kielitoimiston ohjepankki, "Lainausmerkit ja vuorosanaviiva"); the attribution follows a comma.','Quotes: ”…” (ISG 10.4.5 "kokolainausmerkit"; the ISG shows ”…” for all levels in 4.2.3 and uses ’…’ only for the definitions of legal acts, 3.6). The inner level ’…’ is from Kotus, not from the ISG. The same mark opens and closes, so a quotation is read by where each mark stands, not by pairing. The alternative »…» (also used in Finnish) is not implemented, and the ISG and Kotus say nothing about a third level.',"Dash: the ISG 6.4 table spaces a short dash (Alt 0150) and 10.4.8 keeps the long dash for list dashes only, so a break in the sentence is a spaced en dash; 4.2.3 notes that the long list dash of EU texts departs from the Finnish standard language, which uses the shorter dash.",'Numbers: a comma and a "ohuke" (thin fixed space) between groups of three (ISG 6.5, 10.2.1); the pack uses the ordinary no-break space.','Abbreviations: those the ISG lists in 10.7.1 as examples and that end with a period (p., s., v., mrd.), and two it lists without a period that come before a number, klo and nro (the bare list: "klo 17" and "nro 5" are kept together; the ISG uses a fixed space after nro and s. in 4.2.3). The ISG also lists hra, rva, tsto without a period; they come before a name or stand alone, so they are not bound. A bare abbreviation is matched in lower case only (Klo at the start of a sentence is left alone).',"Not implemented, not verified: one-letter words (the ISG gives no list), the hyphen rules of 10.4.7, the colon before case endings (p:ssa), dates (1.4.–30.4.), and Kotus guidance beyond the two pages named in the sources."].join(" ")};var g={code:"fr",name:"French (français)",sample:'Il a dit "nous voilà" - et il est parti... Le labo dure 21-26 septembre, 10:00-12:00. Lire la suite ->',quotes:[[`«${X}`,`${X}»`],["“","”"]],percentSpace:!0,currencySpace:!0,highPunctuation:{colon:X,others:" "},elisions:G,numbers:{group:X,decimal:","},dialogueDash:{mark:"—"},reviewed:!1,sources:["https://vitrinelinguistique.oqlf.gouv.qc.ca/23371/la-ponctuation/tiret/le-tiret-dans-les-dialogues","https://style-guide.europa.eu/en/content/-/isg/topic?identifier=6.5-punctuation-in-figures"],notes:'A no-break space is set inside the guillemets. Digits are grouped with a no-break space (number.group), as the Interinstitutional Style Guide sets for all languages; the decimal mark is a comma. Dialogue: a dash marks each change of speaker, with a no-break space after an opening dash (OQLF Vitrine linguistique, "Le tiret dans les dialogues" and its spacing table); the OQLF accepts the em and the en dash, the engine uses the em dash.'};var IV="https://www.bk.admin.ch/dam/fr/sd-web/t4P98Y1Vnyz-/objekt_55266.pdf (Chancellerie fédérale, Instructions sur la présentation des textes officiels en français, May 2016, read in full as PDF text: ch. 2 unités monétaires, ch. 4 nombres and note 4, ch. 5 espaces insécables)",TV="https://www.bk.admin.ch/dam/de/sd-web/YVHazXZRkqKn/schreibweisungen.pdf (Schweizerische Bundeskanzlei, Schreibweisungen, the German edition, 2013/2015: Rz. 202-203 quotation marks)",OV='https://raw.githubusercontent.com/unicode-org/cldr-json/main/cldr-json/cldr-numbers-full/main/fr-CH/numbers.json (CLDR 48, cldr-numbers-full 48.2.3: currency pattern "#,##0.00 ¤" with U+00A0; percent pattern "#,##0%", no space)',fQ={code:"fr-CH",name:"French (Switzerland)",sample:'Il a dit "nous sommes là" - et il est parti... Le labo fonctionne du 21-26 septembre, 10:00-12:00. Lire la suite ->',quotes:[["«","»"],["‹","›"]],percentSpace:!0,currencySpace:!0,elisions:g.elisions,numbers:{group:X,decimal:",."},reviewed:!1,sources:[IV,TV,OV,...g.sources],notes:["Swiss French quotes: `«outer ‹inner› outer»`, without the no-break space inside that the fr pack sets, as the former ch pack set them from the Swiss Federal Chancellery Schreibweisungen (the German edition, Rz. 202-203). The Chancellery’s French instructions (May 2016, read in full) say nothing on quotation marks; CLDR has the same marks for fr-CH.","No space is set before `; ! ?` and `:`: the pack field that sets it (highPunctuation, read by space.high-punctuation) is set by the fr pack only (this pack copies the fr fields it takes one by one, and not that one). Open item: no Swiss French source on it was read. The Federal Chancellery’s French instructions (May 2016) are silent on `: ; ! ?`; the hints disagree (typoguide.ch is said to set a fine space before `; : ? !`, seen as a summary only; Lacroux mentions Romands who set the fine space; the Chancellery’s own text is typeset with a full space before `:` and `;`). To read before setting the field here: the Guide du typographe (Groupe de Lausanne de l’Association suisse des typographes, the Guide du typographe romand). Dialogue is quoted here (no dialogueDash), unlike the fr pack: the OQLF source on dialogue dashes is cited with the fr sources, but no dialogue dash is set, and either choice is unverified for Switzerland.",'Numbers, from the French instructions (ch. 4): numbers of more than four digits are grouped in threes with an espace insécable (55 000; 1700 stays whole; number.group), and "l’utilisation de l’apostrophe dans les nombres n’est pas admise" (note 4), so everyday Swiss 1’000’000 is not used. The decimal mark is a comma (4,16 millions de francs). The French instructions write francs and centimes as 23 fr. 50 ("et non fr. 50.-", ch. 2); the German Schreibweisungen set a point between francs and rappen in amounts (Rz. 514, 543: Fr. 327.65) and never group with a point or a comma (Rz. 512). So number.group reads a point as a decimal mark too (numbers.decimal ",."), never a separator: CHF 1234567.50 becomes CHF 1 234 567.50, 1234567,50 becomes 1 234 567,50.','Percent and currency: an espace insécable between a number and its unit (ch. 5: 3 %, 50 francs, 300 CHF; 26,1 %), so percentSpace and currencySpace are set. CLDR 48 disagrees on %: its fr-CH percent pattern is "#,##0%" without a space; the Chancellery is followed here. The pack stays reviewed: false (no native reader).'].join(" ")};var cQ={code:"ga",name:"Irish (Gaeilge)",sample:`Dúirt sé "tá mé anseo" - agus d'imigh sé... Mairfidh an obair 21-26 Meán Fómhair, 10:00-12:00. Léigh tuilleadh ->`,quotes:[["‘","’"],["“","”"],["‘","’"]],percentSpace:!0,currencySpace:!1,numbers:{group:X,decimal:"."},reviewed:!1,sources:["https://op.europa.eu/en/web/eu-vocabularies/formex/physical-specifications/character-encoding/use-of-quotation-marks-in-the-different-languages (Publications Office, quotation marks per language: ga ‘…’ “…” ‘…’)",'https://publications.europa.eu/resource/cellar/01ed788a-d266-11ec-a95f-01aa75ed71a1.0015.01/DOC_1 (Interinstitutional Style Guide, Maltese edition, PDF of 19 April 2022: 6.4 spacing table with %, 6.5 "in Maltese, English and Irish publications a point separates whole numbers from decimals" and a space marks thousands, 7 euro: "the same rule applies in English and Irish"; it is evidence about Irish only through those statements)',"https://knowledge-centre-translation-interpretation.ec.europa.eu/en/content/guidelines-translating-eu-documents-irish (Knowledge Centre for Translation and Interpretation: points to the Irish ISG at style-guide.europa.eu/ga and to the An Gúm and Foras na Gaeilge guides; their text was not read)","https://en.wikipedia.org/wiki/Quotation_mark (cross-check only: lists Irish with “…” first and ‘…’ inside, the opposite of the Publications Office table)"],notes:["Quotation: the pack follows the Publications Office table (‘…’ then “…” then ‘…’, the English order). The Irish edition of the Interinstitutional Style Guide (Treoir Stíle Idirinstitiúideach, section 4.2.3) could not be read: style-guide.europa.eu is script-rendered, and the Cellar lists the Irish PDF (manifestations 0018.01 to 0018.03 of 01ed788a-d266-11ec-a95f-01aa75ed71a1) but serves no file for it (404 on DOC_1 and DOC_2). Wikipedia gives “…” first for Irish; quoteStyle: 'us' gives that order.","Apostrophe: d', b', m' (d'fhág, b'fhéidir, m'athair) stand inside a word, which the engine already reads as an apostrophe, not a quote mark; the goldens in ga.test.ts pin that inside and outside a quotation, including a quotation written with straight single marks. The elisions field is empty: no Irish word starts with an apostrophe in any source read.",'Initial mutations: t-, n- and h- (an t-athair, i n-Éirinn, go h-álainn, na h-oibrithe, an t-uisce) are a hyphen after one letter with no space; no rule matches that shape, so they pass through unchanged in both registers, inside and outside a quotation, and beside a numeric range (an t-athair 1-2 sets only the range); with symbol.minus enabled they stay as typed. The goldens in ga.test.ts pin this. A spaced "t -" is not a mutation: an t - athair is set as a sentence dash like any spaced hyphen. The forms were taken from general knowledge of Irish orthography; no source was read.',"Numbers: a point for decimals and a space between groups of three digits are read in the Maltese edition of the ISG, which states it for Irish; the Irish edition was not read. The group separator is a no-break space.","Euro: the Maltese edition says Irish writes the euro sign before the amount without a space (€30). The pack sets percentSpace (5% becomes 5 %) but not currencySpace, so no space is added before €: 30€ stays 30€ and €30 is untouched.","Not implemented, not verified: one-letter words to keep off the end of a line (none sourced), abbreviation lists (none read), the dot-above letters of the old orthography and the fada need no rule (they are letters; tests pin that they are kept), the Irish dash conventions (not read), and everything in the Irish edition of the ISG. The task brief says typograf covers Irish; this pack was not compared with it."].join(" ")};var lQ={code:"hr",name:"Croatian (hrvatski)",sample:'Rekao je "idemo u šumu" - i otišao... Laboratorij radi 21-26. rujna, 10:00-12:00, popust 15%. Više ->',quotes:[["„","”"],["‚","’"],["‚","’"]],abbreviations:{page:["br","str"]},percentSpace:!0,currencySpace:!0,numbers:{group:X,decimal:","},dialogueDash:{mark:"–"},sentenceDash:"–",reviewed:!1,sources:["https://pravopis.hr/pravilo/pravopisni-znakovi-u-upravnome-govoru/72/","https://publications.europa.eu/resource/cellar/01ed788a-d266-11ec-a95f-01aa75ed71a1.0023.01/DOC_1 (Međuinstitucijski stilski priručnik, Croatian ISG, PDF of 19 April 2022: 4.2.3 navodnici, 6.4 interpunkcija i razmaci, 6.5 interpunkcija unutar brojeva, 7.3.3 pravila pisanja monetarnih jedinica, 10.1.8 navodnici, 10.1.10 crtica, 10.1.12 nedjeljivi razmaci, 10.7 kratice)"],notes:["Dialogue and the sentence dash: printed text may set direct speech with dashes instead of quotes, a spaced en dash opening the line and one before the attribution (Institut za hrvatski jezik, Hrvatski pravopis, § 8.16.1).","Quotes: the ISG (10.1.8) names two levels, „…” (Alt 0132, Alt 0148) and ‚…’ (Alt 0130, Alt 0146), and says that a third level reuses the second; the pack lists that third level, so a fourth level starts over from „…”, which the ISG does not mention. The alternative »…« was not found in the ISG and is not set. No other tool or source was read for Croatian: the Hrvatski pravopis (Institut za hrvatski jezik) was not opened, so whether the national orthography differs is not verified.",'Percent and euro: ISG 6.4 shows "00●%" and 10.1.12 lists "15 %" among the fixed spaces; ISG 7.3.3 puts a fixed space between the amount and the code EUR (12 500 EUR). The euro sign is covered by the same rule as in the other packs; the ISG discourages it in running text, so the space before € follows the code.','Abbreviations: only br. and str. before a number (ISG 10.1.12, "između kratica br. ili str. i broja koji slijedi"). Other abbreviations (ISG 10.7 on kratice and pokrate) carry no no-break rule and no list is given, so none is invented.','Numbers: ISG 6.5 prescribes groups of three digits with a space and a comma for decimals; 10.1.12 lists "11 500" among fixed spaces. The grouping is the opt-in rule number.group.',`Not implemented, not verified: one-letter prepositions and conjunctions (k, s, u, o, i, a) are not kept off the end of a line, because the ISG states no such rule and the Hrvatski pravopis was not read; the sentence dash is the engine's default em dash, while ISG 10.1.10 only sets em dash for vertical lists and en dash (no spaces) for ranges, and gives no rule for a dash in a sentence; dates and ordinals ("13. rujna 1959.", "članak 3.") are listed in 10.1.12 as fixed spaces, but the engine has no field for them.`].join(" ")};var dQ={code:"hu",name:"Hungarian (magyar)",sample:'Azt mondta "itt vagyunk" - és elment... A tábor szeptember 21-26., 10:00-12:00. Tovább ->',quotes:[["„","”"],["»","«"],["’","’"]],turnedPairs:[["»","«"]],numbers:{group:X,decimal:","},dialogueDash:{mark:"–"},sentenceDash:"–",reviewed:!1,sources:["https://helyesiras.mta.hu/helyesiras/default/akh12","https://op.europa.eu/en/web/eu-vocabularies/formex/physical-specifications/character-encoding/use-of-quotation-marks-in-the-different-languages","https://folyoirat.ludovika.hu/index.php/hadmernok/libraryFiles/downloadPublic/145","https://commission.europa.eu/resources/europa-web-guide/design-content-and-development/content/web-writing-guidelines/dates-numbers-and-symbols_en"],notes:"Quotes: „…” with »…« inside and ’…’ at the third level (EU Publications Office table); a Hungarian journal guide that follows A magyar helyesírás szabályai, 12th ed., gives `„idézet »belső idézet« idézet vége”`. The MTA rules themselves could not be read. Numbers: a no-break space groups thousands and the decimal mark is a comma (Commission web-writing guide). Not implemented, not verified: % and currency spacing, abbreviations, one-letter words, the sentence dash. Dialogue and the sentence dash: fiction marks dialogue with a gondolatjel, not quotes, and a spaced gondolatjel sets off the attribution (A magyar helyesírás szabályai, 12th ed., rule 259); the rules set the en dash."};var iQ={code:"it",name:"Italian (italiano)",sample:'Disse "siamo qui" - e uscì... Il laboratorio dura 21-26 settembre, 10:00-12:00. Leggi di più ->',quotes:[["«","»"],["“","”"],["‘","’"]],abbreviations:{together:["p. es.","ad es.","op. cit."],page:["n","pag","pagg","art","par","parr","vol","voll"]},percentSpace:!0,currencySpace:!0,numbers:{group:X,decimal:","},dialogueDash:{mark:"—"},truncations:["da","di","fa","sta","va","po","be","mo","pie","que"],reviewed:!1,sources:["https://www.treccani.it/magazine/lingua_italiana/articoli/scritto_e_parlato/punteggiatura9.html","https://publications.europa.eu/resource/cellar/01ed788a-d266-11ec-a95f-01aa75ed71a1.0021.01/DOC_1 (Manuale interistituzionale di convenzioni redazionali, PDF of 19 April 2022: 4.2.3 livelli di virgolette, apostrofo and spazi fissi, 6.4 spaziatura dei segni d’interpunzione, 6.5 interpunzione nelle cifre, 10.1.7 virgolette, 10.1.10 lineetta, allegato A3 abbreviazioni)","https://op.europa.eu/en/web/eu-vocabularies/formex/physical-specifications/character-encoding/use-of-quotation-marks-in-the-different-languages (Publications Office, quotation marks per language: it «…» “…” ‘…’)","https://www.treccani.it/enciclopedia/virgolette_(Enciclopedia-dell'Italiano)/ (Enciclopedia dell’italiano: virgolette basse, alte, singole; the usual order is bassa for the first quotation and alta for those inside)","https://www.treccani.it/enciclopedia/apostrofo_(Enciclopedia-dell'Italiano)/ (Enciclopedia dell’italiano: apostrofo for elision l’amica, truncation po’, dropped digits of a year ’48; the imperatives da’ di’ fa’ sta’ va’ and pie’ be’ mo’ que’ of the truncations field; read as a fetch summary)","https://www.treccani.it/enciclopedia/troncamento_(Enciclopedia-dell'Italiano)/ (Enciclopedia dell’italiano: troncamento, mo’ and pie’ as truncated forms; read as a fetch summary)","https://en.wikipedia.org/wiki/Quotation_mark (cross-check only: Italian «…» “…”)"],notes:['Dialogue: narrative dialogue may open with a spaced lineetta, and the same spaced dash sets off the narrator (F. Longo, Treccani Magazine 2020, "Lineette doppie e lineetta singola"); `« »` is an equally standard choice. The examples there set the en dash; the pack keeps one dash for the text, the em dash of ISG 10, so dialogue and the narrator match.',"Quotation: «…» then “…” then ‘…’ is the order of the Manuale interistituzionale (4.2.3) and of Treccani; some Italian publishers write “…” first, with ‘…’ inside, which quoteStyle: 'us' gives. The Accademia della Crusca was searched, but its editorial criteria PDF could not be read, so it is not cited.","Apostrophe: the engine already reads an apostrophe inside a word (l’amico, dell’architetto), a closing apostrophe of a truncation (un po’) and a year of two digits (’48) as apostrophes, not quote marks; the goldens in it.test.ts pin that inside and outside a quotation. Truncations: the truncations field lists the words that end in an apostrophe, da’ di’ fa’ sta’ va’ (imperatives) and po’ be’ mo’ pie’ que’, from Treccani, Enciclopedia dell’italiano, entries apostrofo (Definizione, Casi incerti, Errori comuni) and troncamento; both entries were read as summaries of a fetch tool, not on the page itself, so the list is to be checked against the pages. After one of them an apostrophe followed by a space, punctuation or the end is an apostrophe when a later straight single mark can close the quotation, so a quotation in straight single quotes that holds one pairs: 'dammi un po' di pane' gives «dammi un po’ di pane», and 'un po'' gives «un po’». Left out: ve’ and vo’, which Treccani calls archaic or local, and to’, read only on Wiktionary. With no such later mark the quotation closes at the word, as before: 'ha detto di' and 'da' give «ha detto di» and «da». Known limit: da, di, fa and va are also words without an apostrophe, so a quotation that ends on one of them and is followed in the same paragraph by a lone straight single mark that can close, 'ha detto di' e poi basta.', reads the first mark as the apostrophe di’. The elisions field lists only words that start with an apostrophe, and the only ones read in a source are the dropped digits of a year, so it is empty: ’800 and ’900 are not implemented, not verified (a single university handout lists them; no authoritative source was read).","Not implemented, not verified: the ISG gives half a fixed space between digit groups (a thin space), set here as a no-break space; no source read gives a list of one-letter words (a, e, i, o) to keep off the end of a line, so there are no orphans; the lineetta of 10.1.10 is the em dash, which is the default; the abbreviation lists are only a part of annex A3, chosen for a number or a second part that follows them."].join(" ")};var xQ={code:"lt",name:"Lithuanian (lietuvių)",sample:'Jis pasakė "štai mes" - ir išėjo... Seminaras vyks rugsėjo 21-26 d., 10:00-12:00, t. y. šią savaitę. Skaityti daugiau ->',quotes:[["„","“"]],abbreviations:{together:["l. e. p.","t. y.","t. t.","š. m.","a. k.","b. k.","e. p.","A. V."],bind:["Nr","dr"],page:["p","pav","tel"]},sentenceDash:"–",percentSpace:!0,currencySpace:!1,numbers:{group:X,decimal:","},dialogueDash:{mark:"–"},reviewed:!1,sources:["https://emokykla.lt/upload/files/2024/07/08/liet-k-skyryba.pdf","https://publications.europa.eu/resource/cellar/01ed788a-d266-11ec-a95f-01aa75ed71a1.0012.01/DOC_1 (Leidinių rengimo vadovas, Lithuanian PDF of 19 April 2022, read as text with pdfjs: 4.2.3 teksto rengimas (kabutės, apsaugotieji tarpai, skaičiai), 6.4 skyrybos ženklai ir tarpai, 6.5 skaitmenų skyryba, 10.1.4 brūkšnys, 10.1.5 brūkšnelis, 10.1.7 kabutės, 10.1.8 tarpas, 10.3.9 sutrumpinimai ir santrumpos)","https://op.europa.eu/en/web/eu-vocabularies/formex/physical-specifications/character-encoding/use-of-quotation-marks-in-the-different-languages (Publications Office, quotation marks per language: lt „…“ at all three levels)"],notes:["Dialogue: dialogue shown as it happens is set with brūkšniai, retold speech with quotes (A. Drukteinis, Lietuvių kalbos skyryba, 2020, rule 4-1).",'Quotation: the ISG (4.2.3: "Visi lygmenys „…“", and the Publications Office table) writes „…“ at every level, so a quotation inside a quotation is „…„…“…“ here. Wikipedia and some Lithuanian publishers write ‚…‘ for the inner level; that was not read in a Lithuanian authority and is not implemented. The ISG note that cultivar names take single quotes (‘…’) is not implemented: the engine cannot tell a cultivar name from a nested quotation. The ISG example 10.1.7 that drops the inner closing mark at the end of a sentence (`„kilo ginčų dėl bendrovės „Microsoft“.`) is a punctuation choice the engine leaves alone.',"The Lithuanian State Commission (Valstybinė lietuvių kalbos komisija) was not consulted: nothing here comes from it, and the ISG is the only source read. Lithuanian is not covered by the other typography tools compared in bench/, so nothing was cross-checked against them.","Dash: ISG 10.1.4 says Lithuanian institutional texts use the en dash, not the em dash, spaced on both sides; the pack sets sentenceDash to U+2013. Dialogue lines that start with a dash (10.1.4 d) take the dialogue dash, set from Drukteinis above.","Not implemented, not verified: the ISG gives no list of one-letter words (į, o, ir is not one letter) to keep off the end of a line, so there are no orphans; elisions: none read; the abbreviation lists are those of ISG 10.3.9 and 10.1.5 that are written in several parts (t. y., t. t., š. m., a. k., b. k., l. e. p., e. p., A. V.) or that introduce a number or name (Nr., dr., p., pav., tel.), and are only a part of the list; a number before its measure (40 mln., 17 val., 100 m.) is not bound because the abbreviation field only binds what follows an abbreviation; the ISG shows € only as the code EUR (5 000 EUR), so the pack sets percentSpace and not currencySpace (49€ stays 49€).","Numbers: ISG 6.5 and 4.2.3 give a comma for decimals and a space between groups of three; 10.1.5 says the space is a fixed one; the ISG groups from four digits in the table of budget data (1 326,1) but the engine groups from five digits, as it does in every language."].join(" ")};var nQ={code:"lv",name:"Latvian (latviešu)",sample:'Viņš teica "mēs esam šeit" - un aizgāja... Seminārs notiks 21-26. septembrī, 10:00-12:00, t. i. šonedēļ. Lasīt vairāk ->',quotes:[["“","”"]],abbreviations:{together:["u. tml.","u. c.","t. i.","š. g.","v. i.","z. v.","P. S."],bind:["Nr"]},sentenceDash:"–",percentSpace:!0,currencySpace:!1,numbers:{group:X,decimal:","},reviewed:!1,sources:["https://publications.europa.eu/resource/cellar/01ed788a-d266-11ec-a95f-01aa75ed71a1.0024.01/DOC_1 (Publikāciju noformēšanas rokasgrāmata, Latvian PDF of 19 April 2022, read as text with pdfjs: 4.2.3 teksta sagatavošana (pēdiņas, saistītās atstarpes, skaitļi), 6.4 interpunkcijas zīmes un atstarpes, 6.5 interpunkcija skaitļos, 10.1.6 pēdiņas, 10.1.7 domuzīme, 10.7 saīsinājumi, simboli un akronīmi)","https://op.europa.eu/en/web/eu-vocabularies/formex/physical-specifications/character-encoding/use-of-quotation-marks-in-the-different-languages (Publications Office, quotation marks per language: lv “…” at all three levels)"],notes:["Quotation: the ISG (4.2.3, 6.4 and 10.1.6) and the Publications Office table write “…” (U+201C, U+201D, both marks at the top, as in English) at every level, so a quotation inside a quotation is “…“…”…” here. This is not the German-shaped „…“ that a Latvian reader may expect from other sources: „…“ was suggested to this pack and was not found in the ISG, so it is not set; no Latviešu valodas aģentūra or Valsts valodas centrs page was read, so nothing says whether „…“ is also accepted by the national authority.","The ISG puts single quotes ‘…’ around translations of words, explanations of meaning and plant variety names (4.2.3, 10.1.6). The engine cannot tell such a use from a nested quotation, so a top-level ‘…’ is not kept (the nesting level decides); this is not implemented. Quotes of the third level are set as “…” as well.",'Dash: ISG 10.1.7 sets a space on each side of the dash; its examples ("brīdinājuma zīme" – zīme, ila – `‘daba’`) use the en dash, and 4.2.3 reserves the em dash for lists and empty table cells, so sentenceDash is U+2013.',"Not implemented, not verified: the ISG gives no list of one-letter words (k, s, v, z, a, i, o, u) to keep off the end of a line, so there are no orphans; elisions: none read; the abbreviation list is only those the ISG itself writes with a fixed space in 10.7 (u. c., u. tml., t. i., š. g., v. i., z. v., P. S.) and Nr.; lpp. (7.–13. lpp.) follows a number and is already kept with it by the number rule; the ISG writes a time range with full stops and an en dash (9.00–18.30, 10.1.7), and the range rule sets it (9.00-18.30 becomes 9.00–18.30; 9:00-18:30 too); the ISG shows € only as the code EUR, so the pack sets percentSpace and not currencySpace (49€ stays 49€).","Numbers: ISG 6.5 gives a comma for decimals and a fixed space between groups of three; the engine groups from five digits, as it does in every language."].join(" ")};var oQ={code:"mt",name:"Maltese (Malti)",sample:'Qal "jien hawn" - u telaq... Ix-xogħol idum 21-26 Settembru, 10:00-12:00. Aqra aktar ->',quotes:[["“","”"],["‘","’"]],abbreviations:{page:["p","pp"],bare:["Nru"]},percentSpace:!0,currencySpace:!1,numbers:{group:X,decimal:"."},truncations:["ta","ma"],reviewed:!1,sources:["https://publications.europa.eu/resource/cellar/01ed788a-d266-11ec-a95f-01aa75ed71a1.0015.01/DOC_1 (Il-Gwida tal-Istil Interistituzzjonali, PDF of 19 April 2022: 4.2.3 virgoletti, apostrofu and spazji fissi, 5.10 kwotazzjonijiet, 6.4 sinjali tal-punteġġatura u l-ispazji, 6.5 punteġġatura fiċ-ċifri, 7 euro)","https://op.europa.eu/en/web/eu-vocabularies/formex/physical-specifications/character-encoding/use-of-quotation-marks-in-the-different-languages (Publications Office, quotation marks per language: mt “…” ‘…’ “…”)","https://en.wikipedia.org/wiki/Quotation_mark (cross-check only: Maltese “…” ‘…’)","https://en.wiktionary.org/wiki/ta%27 and https://en.wiktionary.org/wiki/ma%27 (Wiktionary, Maltese entries ta' and ma': prepositions with a final apostrophe, the truncations field; a community dictionary, low authority, read as a fetch summary)"],notes:['Quotation: “…” then ‘…’ is ISG 4.2.3 ("in Maltese, a quotation is set between double marks, single marks for a quotation inside a quotation; further levels repeat levels 1 and 2") and the Publications Office table; the pack has two levels, and a deeper quotation starts over, which is what the ISG says. The Kunsill Nazzjonali tal-Ilsien Malti was not searched.',"Apostrophe: ISG 4.2.3 asks for the typographic apostrophe ’, not the keyboard one. ta', m'hu, x'inhu and the hyphenated articles (l-ħobż, taċ-ċikkulata) stand inside a word or before a space, and the goldens in mt.test.ts pin that they round-trip inside and outside a quotation, including a quotation written with straight single marks around m'hu. Truncations: the truncations field lists ta' (of) and ma' (with), prepositions written with a final apostrophe, taken from Wiktionary (English edition, Maltese entries, read as a fetch summary) only: a community dictionary, low authority, not checked against a Maltese grammar or the Kunsill Nazzjonali tal-Ilsien Malti. After one of them an apostrophe followed by a space, punctuation or the end stays an apostrophe when a later straight single mark can close the quotation, so a quotation written with straight single marks that holds one pairs: `'il-ktieb ta' Mario'` gives `“il-ktieb ta’ Mario”`. sa' and bla' were not confirmed in any source read and are left out. With no such later mark the quotation closes at the word, as before ('ma' gives “ma”). Known limit: ma is also the negation (ma nafx), so a quotation that ends on ma and is followed in the same paragraph by a lone straight single mark that can close reads the first mark as the apostrophe. The elisions field is empty: no Maltese word starts with an apostrophe in any source read.","Numbers: ISG 6.5 gives a point for the decimals and a space between groups of three digits in Maltese (the Official Journal uses a comma, for technical reasons); the group separator is a no-break space, the fixed space of the ISG.","Abbreviations: only p. and pp. before a page number, shown with a fixed space in 4.2.3 (p.• ĠU C) and used in 5.10 (pp. 71–98). Nru is written without a full stop and is followed by a fixed space in 4.2.3 (Nru• ĠU L); the pack lists it in the bare field, so a no-break space follows it before a number (Nru 5).","Euro: ISG 7 writes the euro sign before the amount without a space in Maltese (€30). The pack sets percentSpace (5% becomes 5 %) but not currencySpace, so no space is added before €: 30€ stays 30€ and €30 is untouched.","Not implemented, not verified: one-letter words to keep off the end of a line (none sourced), the dash conventions of the language (not read), longer abbreviation lists, the national rules of the Kunsill Nazzjonali tal-Ilsien Malti. No other typography tool read covers Maltese."].join(" ")};var sQ={code:"nl",name:"Dutch (Nederlands)",sample:`Hij zei "ik zie 't huis en zo'n boom" - en ging... Het lab loopt 21-26 september, 10:00-12:00. Meer ->`,quotes:[["“","”"],["‘","’"]],elisions:["s","m","t"],reviewed:!1,sources:["https://taaladvies.net/dubbele-of-enkele-aanhalingstekens-bij-een-citaat/","https://nl.wikipedia.org/wiki/Aanhalingsteken","https://nl.wikipedia.org/wiki/Apostrof_in_de_Nederlandse_spelling","https://www.vlaanderen.be/team-taaladvies/taaladviezen/apostrof-taalkundige-term-gebruik","https://www.vlaanderen.be/team-taaladvies/taaladviezen/procentteken-spatie","https://en.wikipedia.org/wiki/Quotation_mark"],notes:'Quotes: Taaladvies.net (Taalunie) says there is no fixed rule: double marks were traditional, single are common now, one system consistently; for a quotation inside a quotation it gives double for the outer and single for the inner "of andersom". '+"The pack sets “…” with ‘…’ inside, the pair the Wikipedia table gives as primary and secondary. "+"The other system, `‘outer “inner” outer’`, and the traditional „…” with ‚…’ (nl.wikipedia calls „…” the Dutch double mark for speech) are read from the source but not set. "+"Apostrophes: nl.wikipedia warns that a single quotation mark must not be confused with the apostrophe (’s morgens is not an opening quote). "+"’s and ’m are listed there and ’s and ’n on the Flemish Team Taaladvies page; ’t is not on any page read, it is added as the same kind of dropped-letter form (’t huis), not verified. "+"’n (’n feestje) is not set: the engine reads the elision n only as rock 'n' roll, so a lone ’n before a word is not protected. "+"Percent: Team Taaladvies says it is usually written without a space (the Belgian standard NBN Z 01-002 asks for one, for exact-science fields), so percentSpace is off. Not implemented, not verified: the EU Interinstitutional Style Guide could not be read (its pages are scripted and gave no text); number format, sentence dash, abbreviations, one-letter words (none is a Dutch convention in any page read)."};var rQ={code:"pl",name:"Polish (polski)",sample:'Powiedział "jesteśmy tu" - i wyszedł... Laboratorium trwa 21-26 września, 10:00-12:00. Czytaj więcej ->',quotes:[["„","”"],["«","»"]],orphans:/(?<![\p{L}\p{N}])([aAiIoOuUwWzZ])[ ]+(?=\S)/gu,shortWords:["do","od","we","na","po","za","ze","dla","bez","pod","nad","lub","czy"],abbreviations:{bind:["ul","al","pl","os","im","godz","zob","np","tzw","tel","ks","św","mgr","inż"],page:["nr","s","poz"]},elisions:G,numbers:{group:" ",decimal:","},currencySpace:!0,dialogueDash:{mark:"—"},reviewed:!1,sources:["https://sjp.pwn.pl/poradnia/haslo/Pauza-dialogowa-a-myslnik;18816.html","https://sjp.pwn.pl/poradnia/haslo/Sieroty-na-koncu-wiersza;18684.html","https://style-guide.europa.eu/en/content/-/isg/topic?identifier=6.5-punctuation-in-figures",'https://sjp.pwn.pl/poradnia/haslo/Jeszcze-raz-o-spacji-lub-jej-braku-po-znaku;21530.html (PWN Poradnia, A. Wolański: "Jeszcze raz o spacji lub jej braku po znaku %", 26.11.2021; also "Odstępy lub ich brak w oznaczeniach jednostek miar", 7.03.2022, and "procent, proc., %", 26.01.2023)','https://raw.githubusercontent.com/unicode-org/cldr-json/main/cldr-json/cldr-numbers-full/main/pl/numbers.json (CLDR 48, cldr-numbers-full 48.2.3: currency pattern "#,##0.00 ¤" with U+00A0, percent pattern "#,##0%")'],notes:'One-letter conjunctions and prepositions are bound to the next word. Digits are grouped with a no-break space (number.group), as the Interinstitutional Style Guide sets for all languages; the decimal mark is a comma. Dialogue: a line of dialogue opens with the same dash as a break in the sentence, pauza or półpauza, spaced (PWN Poradnia, A. Wolański, "Pauza dialogowa a myślnik"); the engine uses the em dash it uses for a break. Percent: no space is set before % (PWN Poradnia, A. Wolański, 2023: "50% (nie: 50 %)", the Polish tradition); since the 2020 regulation on legal units of measure PWN also accepts 38,4 % (2021), so 50% stays 50% and a typed 38,4 % is left as typed. Currency: a no-break space between a number and € after it (49 €), from CLDR 48 (pl currency pattern "#,##0.00 ¤"); the PWN answer on zł was not read.'};var aQ={code:"pt",name:"Portuguese (português)",sample:'Ele disse "estamos aqui" - e saiu... O laboratório dura 21-26 de setembro, 10:00-12:00. Ler mais ->',quotes:[["«","»"],["“","”"],["‘","’"]],abbreviations:{together:["p. ex.","a. C.","d. C.","N. B.","P. S.","S. A.","S. M."],bind:["Av"],page:["p","cap","fig","vol"]},percentSpace:!0,currencySpace:!1,numbers:{group:X,decimal:","},dialogueDash:{mark:"—"},reviewed:!1,sources:["https://ciberduvidas.iscte-iul.pt/consultorio/perguntas/travessao-no-discurso-directo/8747","https://publications.europa.eu/resource/cellar/01ed788a-d266-11ec-a95f-01aa75ed71a1.0008.01/DOC_1 (Código de Redação Interinstitucional, Portuguese of Portugal, PDF of 19 April 2022: 4.2.3 níveis de aspas and espaço protegido, 6.4 espaçamento dos sinais de pontuação, 6.5 pontuação nos números, 10.4.8 travessão, 10.4.10 aspas, anexo A3 abreviaturas)","https://op.europa.eu/en/web/eu-vocabularies/formex/physical-specifications/character-encoding/use-of-quotation-marks-in-the-different-languages (Publications Office, quotation marks per language: pt «…» “…” ‘…’)","https://ciberduvidas.iscte-iul.pt/consultorio/perguntas/o-uso-das-aspas--e-/13051 (Ciberdúvidas da Língua Portuguesa: «…» for quotation, “…” for a quotation inside a transcription, ‘…’ for a third level; example `«O chefe disse ao seu subordinado: “Disfarce quando ouvir a palavra ‘relatório’, combinado?”»`)","https://pt.wikipedia.org/wiki/Aspas (cross-check only: Portugal «…», Brazil “…” ‘…’)"],notes:['Dialogue: the travessão opens each turn and sets off the narrator, spaced in the examples (Ciberdúvidas, "Travessão no discurso directo"); no rule on spacing was found.',"European Portuguese is chosen because the audience is the EU: «…» then “…” then ‘…’, as in the Código de Redação Interinstitucional and at Ciberdúvidas (whose answer describes its own house style, the one used here). Brazilian Portuguese writes “…” with ‘…’ inside (Wikipedia, cross-check), which quoteStyle: 'us' gives; no Brazilian style guide was read, and the Brazilian number format and abbreviations were not looked at.","Not implemented, not verified: no source read gives a list of one-letter words (a, e, o) to keep off the end of a line, so there are no orphans; the travessão of 10.4.8 is the em dash, which is the default, and the dialogue dash is the same em dash, set from Ciberdúvidas above; the ordinals n.º and the forms Dr.ª, Sr.ª of annex A3 are not covered; elisions: a Portuguese apostrophe inside a word (d’Ouro) is already read as an apostrophe by the engine and no word starting with an apostrophe was found in a source; the ISG table read shows the space before % only, so the pack sets percentSpace and not currencySpace (49€ stays 49€)."].join(" ")};var eQ={code:"ro",name:"Romanian (română)",sample:'A spus "suntem aici" - și a plecat... Cursul este între 21-26 septembrie, 10:00-12:00. Citește mai mult ->',quotes:[["„","”"],["«","»"]],numbers:{group:X,decimal:","},dialogueDash:{mark:"–"},sentenceDash:"–",reviewed:!1,sources:["https://dexonline.ro/article/09._Linia_de_dialog_%C8%99i_de_pauz%C4%83","https://op.europa.eu/en/web/eu-vocabularies/formex/physical-specifications/character-encoding/use-of-quotation-marks-in-the-different-languages","https://commission.europa.eu/resources/europa-web-guide/design-content-and-development/content/web-writing-guidelines/dates-numbers-and-symbols_en"],notes:"Quotes: „…” with «…» inside, the third level „…” again (EU Publications Office table). The Academy (Îndreptar, DOOM) text could not be read, so the national authority is not cited. Numbers: a no-break space groups thousands and the decimal mark is a comma (Commission web-writing guide). Not implemented, not verified: % and currency spacing, abbreviations, one-letter words, the sentence dash. Dialogue and the sentence dash: the linia de dialog opens each turn and a spaced linie de pauză sets off the words of the author (Îndreptarul ortografic, 5th ed., §§ 275–281, on dexonline); a dash together with quotation marks is called wrong. The examples show the en dash."};var tQ={code:"sk",name:"Slovak (slovenčina)",sample:'Povedal "ideme k lesu" - a odišiel... Laboratórium beží 21-26 septembra, 10:00-12:00. Viac ->',quotes:[["„","“"],["‚","‘"]],orphans:/(?<![\p{L}\p{N}])([kKsSvVzZoOuUaAiI])[ ]+(?=\S)/gu,shortWords:["do","od","vo","na","so","za","po","pre","pri","nad","pod","bez"],numbers:{group:X,decimal:","},dialogueDash:{mark:"–"},sentenceDash:"–",reviewed:!1,sources:["https://www.juls.savba.sk/ediela/psp2000/psp.pdf","https://www.teraz.sk/slovencina/slovencina-ako-pouzivat-slovenske/348361-clanok.html","https://touchit.sk/jazykove-okienko-ako-je-to-s-pisanim-cisloviek/127957/","https://tvorim.net/typografia/72-pisanie-zaverecnych-prac-a-tvorba-casopisov","https://sk.wikibooks.org/wiki/Pomoc:Štylistická_príručka","https://en.wikipedia.org/wiki/Quotation_mark"],notes:"Quotes: „…“ with ‚…‘ inside. Read from a TASR language column that cites Pravidlá slovenského pravopisu (2000, s. 107 – 108) and gives „…“ and the single ‚…‘ for a quotation inside one; "+"the Pravidlá themselves (juls.savba.sk PDF) could not be read, and the Wikipedia table lists »…« and ›…‹ as the alternative, which is not set. "+"Number format: groups of three digits separated by a space, decimal comma (a column by an expert of Jazykovedný ústav Ľ. Štúra, touchit.sk, citing the Pravidlá 2013); read by the opt-in rule number.group. "+"Not implemented, not verified: the EU Interinstitutional Style Guide could not be read (its pages are scripted and gave no text); an authority for the one-letter words at line end (see below: the list is set, but only from secondary sources); "+"a space before % (a secondary overview says Slovak writes 50 %, not confirmed against the Pravidlá; a space already written is still kept with its number by the number-unit rule); "+"abbreviations. "+"One-letter words at line end (v, k, s, u, z, o, a, i, both cases) are bound to the next word as an editorial convention, not a verified rule: a typography article (tvorim.net, 2008) and a Slovak wikibook style guide name the words, and a design studio page (grafeon.sk) states the class without letters; the Slovak authority pages (jazykovaporadna.sme.sk, the Pravidlá PDF) could not be read. Two-letter words are not bound. "+"Dialogue and the sentence dash: dashes are the newer alternative to quotes for direct speech, spaced, with one before the attribution (Pravidlá slovenského pravopisu, 3rd ed., 2000, úvodzovky and pomlčka 10)."};var QZ={code:"sl",name:"Slovenian (slovenščina)",sample:'Rekel je "gremo v gozd" - in odšel... Laboratorij deluje 21-26 septembra, 10:00-12:00, 15% popusta. Več ->',quotes:[["„","“"],["‚","‘"],["‚","‘"]],sentenceDash:"–",sentenceDashLiterary:"–",abbreviations:{page:["št","str"]},percentSpace:!0,currencySpace:!0,numbers:{group:X,decimal:","},dialogueDash:{mark:"–"},reviewed:!1,sources:["https://www.fran.si/134/slovenski-pravopis/datoteke/Pravopis_Pravila.pdf","https://publications.europa.eu/resource/cellar/01ed788a-d266-11ec-a95f-01aa75ed71a1.0010.01/DOC_1 (Medinstitucionalni slogovni priročnik, Slovenian ISG, PDF of 19 April 2022: 4.2.3 narekovaji, števila and nedeljivi presledki, 6.4 ločila in presledki, 6.5 postavljanje ločil v številih, 7.3.3 denarne enote, 10.1.6 narekovaj, 10.1.7 pomišljaj, 10.8 razno)"],notes:["Dialogue: quotes are the norm, but a dash may open direct speech at the start of a paragraph with no lead-in clause (Slovenski pravopis 2001, § 388.6); the attribution follows a comma, not a dash.","Quotes: the ISG (10.1.6) sets „…“ (Alt 0132, Alt 0147) for a literal quotation and ‚…‘ (Alt 0130, Alt 0145) only inside it and at the third level (`„xxx ‚xxx ‚xxx‘ xxx‘ xxx“`); 4.2.3 says the third level reuses the second. A fourth level starts over from „…“ here, which the ISG does not mention. The alternative »…« was not found in the ISG and is not set; Slovenski pravopis (ZRC SAZU) was not opened.",`Dash: ISG 10.1.7 names the en dash (pomišljaj) as a stronger mark than a comma and a glossing device; whether it is spaced is not stated in the section (the table in 6.4 shows "xx – xx" as well as "xx–xx", and the guide's own running text sets it spaced), so the spaced en dash is taken from the guide's own text, not from a stated rule. The em dash is for list bullets (10.1.8).`,'Percent and euro: ISG 6.4 shows "00●%", 10.8 requires a fixed space between a number and its unit (15 %); 7.3.3 puts a fixed space between the amount and EUR, or the euro sign.','Abbreviations: only št. and str., which the ISG shows with a fixed space (4.2.3: "št.• UL L", "str.• UL C"); the engine binds them to a following number. No abbreviation list was read, so none is invented.',"Numbers: ISG 4.2.3 and 6.5 prescribe groups of three digits separated by a fixed space and a comma for decimals; numbers that number things (years, pages) are written without a space. The grouping is the opt-in rule number.group.","Not implemented, not verified: one-letter prepositions and conjunctions (k, s, v, z, o, a, i, u) are not kept off the end of a line, because the ISG states no such rule and Slovenski pravopis was not read; the period placement relative to a closing quotation mark (10.1.6) is a punctuation-in-quotes rule the engine does not have."].join(" ")};var ZZ={code:"sv",name:"Swedish (svenska)",sample:'Han sa "vi är här" - och gick... Kursen pågår 21-26 september, 10:00-12:00. Läs mer ->',quotes:[["”","”"],["’","’"]],sameMarkQuotes:!0,numbers:{group:X,decimal:","},dialogueDash:{mark:"–"},sentenceDash:"–",reviewed:!1,sources:["https://frageladan.isof.se/visasvar.py?svar=52014","https://op.europa.eu/en/web/eu-vocabularies/formex/physical-specifications/character-encoding/use-of-quotation-marks-in-the-different-languages","https://frageladan.isof.se/visasvar.py?svar=46237","https://commission.europa.eu/resources/europa-web-guide/design-content-and-development/content/web-writing-guidelines/dates-numbers-and-symbols_en"],notes:'Quotes: ”…” with ’…’ inside (EU Publications Office table; Frågelådan, Institutet för språk och folkminnen, says an inner quotation takes single marks). The same mark opens and closes, so a quotation is read by where each mark stands, not by pairing. The alternative »…» (same mark both sides) is not implemented. Numbers: a no-break space groups thousands and the decimal mark is a comma (Commission web-writing guide, which names no Swedish rule beyond "all other languages"). Not implemented, not verified: % and currency spacing, abbreviations, one-letter words, the sentence dash; the Interinstitutional Style Guide chapters and Svenska skrivregler could not be read. Dialogue and the sentence dash: a tankstreck on a new line opens each turn, common in news and fiction (Isof Frågelådan, "Kan man markera anföring med tankstreck?"); the tankstreck is the en dash.'};var VZ={code:"uk",name:"Ukrainian (українська)",sample:'Він сказав: "ми тут" - і пішов... Лабораторія триває 21-26 вересня, 10:00-12:00. Докладніше ->',quotes:[["«","»"],["„","“"],["‚","‘"]],orphans:/(?<![\p{L}\p{N}])([аАвВіІїЇйЙзЗуУоО])[ ]+(?=\S)/gu,shortWords:["до","на","за","по","із","від","під","над","при","без","для","та","що"],abbreviations:{together:["т. д.","т. п.","т. ч."],bind:["м","вул","просп","пров","пл","обл","ім","див","рис","табл"],page:["с","ст","ч"]},currencySpace:!0,dialogueDash:{mark:"—"},elisions:G,numbers:{group:" ",decimal:","},reviewed:!1,sources:["https://www.pravopys.net/sections/125/","https://slovnyk.ua/pravopys.php?prav_par=167 (Український правопис 2019, § 164 «Лапки», § 167 «Розділові знаки для оформлення прямої мови та цитат», as published on slovnyk.ua; not compared with the official PDF)",'https://raw.githubusercontent.com/unicode-org/cldr-json/main/cldr-json/cldr-numbers-full/main/uk/numbers.json (CLDR 48, cldr-numbers-full 48.2.3: currency pattern "#,##0.00 ¤" with U+00A0, percent pattern "#,##0%")',"https://style-guide.europa.eu/en/content/-/isg/topic?identifier=6.5-punctuation-in-figures"],notes:'The literary register keeps the display quotes; the dialogue dash (an em dash and a no-break space) is set in both registers. Digits are grouped with a no-break space (number.group), as the Interinstitutional Style Guide sets for all languages; the decimal mark is a comma. Dialogue: a paragraph of direct speech opens with тире (Український правопис § 125, the 1993 rules as published on pravopys.net); the 2019 edition says the same in § 167, read on slovnyk.ua, a section-by-section copy, because the official PDF on mon.gov.ua could not be fetched (the copy was not compared with the PDF). Quotes: § 164 of the 2019 edition recommends «…» outside and “…” inside and lists „…“ as a further form; the pack keeps „…“ inside (CLDR). Currency: a no-break space between a number and € after it (49 €), from CLDR 48 (uk currency pattern "#,##0.00 ¤"); no national guide on it was read, and the Pravopys 2019 sections read say nothing on currency or %. No space is set before %: the CLDR uk percent pattern is "#,##0%".'};var XQ=[hQ,VZ,w,rQ,g,SQ,fQ,kQ,tQ,sQ,ZZ,eQ,dQ,uQ,iQ,aQ,cQ,oQ,gQ,lQ,QZ,xQ,nQ,pQ,NQ,mQ,EQ],a9=Object.fromEntries(XQ.map((Q)=>[Q.code,Q]));var k=XQ.map((Q)=>Q.code);var PV=/\p{L}/u,AV=/[\p{L}\p{N}]/u,jZ=/(?<=\p{L})x/u.test("\uD835\uDD1Ex");function F(Q,Z){if(Z<=0)return"";let V=Q.charCodeAt(Z-1);if(V>=56320&&V<=57343&&Z>=2){let j=Q.charCodeAt(Z-2);if(j>=55296&&j<=56319)return Q.slice(Z-2,Z)}return Q.charAt(Z-1)}function _(Q){if(Q==="")return!1;let Z=Q.charCodeAt(0);if(Z<128)return(Z|32)-97>>>0<26;if(Q.length>1&&!jZ)return!1;return PV.test(Q)}function C(Q){if(Q==="")return!1;let Z=Q.charCodeAt(0);if(Z<128)return(Z|32)-97>>>0<26||Z>=48&&Z<=57;if(Q.length>1&&!jZ)return!1;return AV.test(Q)}function B(Q,Z,V,j){Z.lastIndex=0;let z="",J=0;for(let $=Z.exec(Q);$;$=Z.exec(Q))if(V(Q,$.index))z+=Q.slice(J,$.index)+j($),J=$.index+$[0].length;else Z.lastIndex=$.index+(Z.unicode&&($[0].codePointAt(0)??0)>65535?2:1);return Z.lastIndex=0,J===0?Q:z+Q.slice(J)}function _V(Q,Z,V,j){if(Q.length>4||Z.length>4)return!1;if(Q.length===3&&Z.length===4&&!/\s|\u00A0/.test(j))return!1;if(/^0\d/.test(Q)||/^0\d/.test(Z))return!1;if(Number(Q)>=Number(Z))return!1;if(Q.length===4&&Z.len
