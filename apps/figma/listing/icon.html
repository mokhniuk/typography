<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Typography icon</title>
<style>
:root { --color-accent: #0b6bcb; --color-ink: #ffffff; }
html, body { margin: 0; width: 128px; height: 128px; background: var(--color-accent); }
body { display: grid; place-items: center; overflow: hidden; }
p { margin: 0; color: var(--color-ink); font: 700 112px / 1 Georgia, "Times New Roman", serif; transform: translateY(14px); }
</style>
</head>
<body>
<p aria-label="Typography">&ldquo;</p>
</body>
</html>
